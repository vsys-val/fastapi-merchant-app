name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 09 * * *"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production API
        run: python scripts/smoke_test.py
