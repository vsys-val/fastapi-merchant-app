name: Network check

# Diagnóstico manual: como o IP do cliente chega à API, direto e pelo
# proxy /api/* do site estático. Não grava nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/network_check.py
